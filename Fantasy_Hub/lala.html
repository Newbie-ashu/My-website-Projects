<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Border Animation</title>
  <style>
    .border-change {
      font-size: 40px;
      font-weight: bold;
      padding: 20px;
      border: 5px solid blue;
      display: inline-block;
      animation: borderCycle 2s infinite alternate;
    }

    @keyframes borderCycle {
      from {
        border-color: blue;
      }
      to {
        border-color: red;
      }
    }
  </style>
</head>
<body>
  <h1 class="border-change">Animated Border!</h1>
</body>
</html>
